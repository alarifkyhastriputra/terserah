<!DOCTYPE html>
<html>
<head>
<meta charset="UFC-8">
<meta name="viewport" content=width=device-width, initial-scale=1.0">
<title>Hercu OTG</title

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root{
  --bg:#f4f6fb;
  --card:#fff;
  --text:#1e1e2f;
  --primary:#6c5ce7;
}
body.dark{--bg:#121212;--card:#1e1e2f;--text:#fff;}
body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;}

.header{
  padding:18px;text-align:center;
  background:var(--primary);color:#fff;font-weight:bold;
  position:relative;
}
.mode,.lock{position:absolute;top:15px;cursor:pointer;}
.mode{left:15px;} .lock{right:15px;}

.container{max-width:520px;margin:auto;padding:15px;}
.card{
  background:var(--card);
  padding:16px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
  
.card button{position:relative;z-index:2;}

input,select,button{
  width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ddd;
}
button{background:var(--primary);color:#fff;border:none;cursor:pointer;}

.option{background:#eef;padding:10px;margin-top:5px;border-radius:8px;}

#overlay{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  align-items:center;
  justify-content:center;
}

.popup{
  width:90%;
  max-width:400px;
  display:none;

#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  opacity:0;
  transition:0.3s;
  z-index:9999;
}
#toast.show{opacity:1;bottom:50px;}
</style>
</head>
