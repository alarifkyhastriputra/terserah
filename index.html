<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boom What?!</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#facc15,#eab308);
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  border-radius:25px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  color:#b45309;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#92400e;
  margin-bottom:20px;
}

h2{
  color:#92400e;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  background:#fef9c3;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  background:#facc15;
  color:#713f12;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.room{
  background:#fef3c7;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

.chat{
  height:320px;
  overflow-y:auto;
  background:#fef9c3;
  border-radius:15px;
  padding:10px;
  margin-top:10px;
}

.msg{
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  max-width:85%;
  word-wrap:break-word;
}

.player{
  background:#facc15;
  color:#713f12;
  margin-left:auto;
}

.answer{
  background:#f59e0b;
  color:white;
}

.system{
  background:#fde68a;
  color:#78350f;
}

.hidden{
  display:none;
}

.role{
  text-align:center;
  font-weight:bold;
  color:#92400e;
  margin-bottom:15px;
  font-size:18px;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<div class="logo">
💥 Boom What?!
</div>

<div class="subtitle">
Game Tebak Kata Multiplayer Online
</div>

<h2>Buat Room</h2>

<input 
type="text"
id="createName"
placeholder="Nama pemain">

<input 
type="text"
id="createRoom"
placeholder="Nama room">

<button onclick="createRoom()">
Buat Room
</button>

</div>



<div class="card">

<h2>📋 Room List</h2>

<div id="roomList">
Loading...
</div>

</div>



<div class="card hidden" id="gameCard">

<div class="role" id="roleText"></div>



<div id="secretBox">

<h2>🔐 Kata Rahasia</h2>

<input 
type="password"
id="secretInput"
placeholder="Masukkan kata rahasia">

<button onclick="saveSecret()">
Simpan Kata
</button>

</div>



<h2>💬 Chat Game</h2>

<div class="chat" id="chat"></div>

<input 
type="text"
id="messageInput"
placeholder="Tulis pertanyaan atau tebakan">

<button onclick="sendMessage()">
Kirim Pesan
</button>



<div id="answerButtons">

<button onclick="sendAnswer('Iya ✅')">
Iya
</button>

<button onclick="sendAnswer('Tidak ❌')">
Tidak
</button>

<button onclick="sendAnswer('Mungkin 🤔')">
Mungkin
</button>

</div>

</div>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
push,
get,
onValue,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// FIREBASE BARU

const firebaseConfig = {

apiKey: "AIzaSyCZIDtUteM2MiESDJd35gaKPHX_Ht1zL6s",

authDomain: "projectchat01-d16bc.firebaseapp.com",

databaseURL: "https://projectchat01-d16bc-default-rtdb.firebaseio.com",

projectId: "projectchat01-d16bc",

storageBucket: "projectchat01-d16bc.appspot.com",

messagingSenderId: "163313653543",

appId: "1:163313653543:web:2124df8e1581192411bb02",

measurementId: "G-96VFCGYCWL"

};



// INIT

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



// GLOBAL

let room = "";
let name = "";
let role = "";



// BUAT ROOM

window.createRoom = async function(){

name =
document
.getElementById("createName")
.value
.trim();

room =
document
.getElementById("createRoom")
.value
.trim();

if(name === "" || room === ""){

alert("Lengkapi data");

return;

}

role = "giver";

await set(

ref(db,"rooms/" + room + "/info"),

{
room:room,
owner:name
}

);

window.joinGame();

};



// ROOM LIST

const roomsRef = ref(db,"rooms");

onValue(roomsRef,(snapshot)=>{

const data = snapshot.val();

const roomList =
document.getElementById("roomList");

roomList.innerHTML = "";

if(!data){

roomList.innerHTML =
"Belum ada room";

return;

}

for(let key in data){

const roomData =
data[key]?.info;

if(!roomData) continue;

const div =
document.createElement("div");

div.className = "room";

div.innerHTML = `

<b>🎮 ${roomData.room}</b><br>
Owner: ${roomData.owner}<br>

<button onclick="joinRoom('${roomData.room}')">
Join Room
</button>

`;

roomList.appendChild(div);

}

});



// JOIN ROOM

window.joinRoom = function(roomId){

const player =
prompt("Masukkan nama pemain");

if(!player) return;

room = roomId;

name = player;

role = "guesser";

window.joinGame();

};



// MASUK GAME

window.joinGame = function(){

document
.getElementById("gameCard")
.classList.remove("hidden");


if(role === "giver"){

document
.getElementById("roleText")
.innerHTML =
"👑 Kamu adalah Pemberi Kata";

}else{

document
.getElementById("roleText")
.innerHTML =
"🕵️ Kamu adalah Penebak Kata";

document
.getElementById("secretBox")
.style.display = "none";

}


if(role !== "giver"){

document
.getElementById("answerButtons")
.style.display = "none";

}


const chatRef =
ref(db,"rooms/" + room + "/chat");


onChildAdded(chatRef,(snapshot)=>{

const data = snapshot.val();

addMessage(
data.type,
data.name,
data.text
);

});


push(

ref(db,"rooms/" + room + "/chat"),

{
type:"system",
name:"SYSTEM",
text:name + " masuk room 🔥"
}

);

};



// SIMPAN KATA

window.saveSecret = function(){

const secret =
document
.getElementById("secretInput")
.value
.trim();

if(secret === ""){

alert("Masukkan kata");

return;

}

set(

ref(db,"rooms/" + room + "/secret"),

{
word:secret
}

);

push(

ref(db,"rooms/" + room + "/chat"),

{
type:"system",
name:"SYSTEM",
text:"Kata rahasia berhasil dibuat 🔐"
}

);

};



// KIRIM PESAN

window.sendMessage = async function(){

const input =
document
.getElementById("messageInput");

const text =
input.value.trim();

if(text === "") return;


const secretRef =
ref(db,"rooms/" + room + "/secret");

const snap =
await get(secretRef);


if(snap.exists()){

const secret =
snap.val().word;

if(
text.toLowerCase()
===
secret.toLowerCase()
){

push(

ref(db,"rooms/" + room + "/chat"),

{
type:"system",
name:"SYSTEM",
text:
"🎉 " +
name +
" berhasil menebak kata: " +
secret
}

);

input.value = "";

return;

}

}


push(

ref(db,"rooms/" + room + "/chat"),

{
type:"player",
name:name,
text:text
}

);

input.value = "";

};



// JAWABAN

window.sendAnswer = function(answer){

push(

ref(db,"rooms/" + room + "/chat"),

{
type:"answer",
name:name,
text:answer
}

);

};



// TAMPILKAN CHAT

function addMessage(type,name,text){

const chat =
document.getElementById("chat");

const div =
document.createElement("div");

div.className =
"msg " + type;

div.innerHTML =
"<b>" +
name +
"</b><br>" +
text;

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

}



// ENTER KEY

document
.getElementById("messageInput")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

sendMessage();

}

});

</script>

</body>
</html>
